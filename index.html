<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Šúdolské Šípky</title>
<meta name="description" content="Šípkarský klub — hrací deň, výsledky, rebríček">
<meta name="theme-color" content="#c9a84c">
<meta name="application-name" content="Šúdolské Šípky">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Šípky">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--navy:#0a0f1e;--navy2:#111827;--navy3:#1a2540;--gold:#c9a84c;--gold2:#e8c96a;--gold3:#f5e3a0;--red:#b91c1c;--cream:#f5e8d0;--b1:rgba(201,168,76,0.25);--b2:rgba(201,168,76,0.55)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--cream);font-family:'Rajdhani',sans-serif;min-height:100vh}
header{background:linear-gradient(180deg,#000,var(--navy));border-bottom:2px solid var(--gold);padding:.5rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.5);flex-wrap:wrap;gap:.5rem}
.hlogo{display:flex;align-items:center;gap:.8rem}
.hlogo img{width:56px;height:56px;object-fit:contain}
.htitle{font-family:'Oswald',sans-serif;font-size:1.3rem;font-weight:700;color:var(--gold2);text-transform:uppercase;letter-spacing:2px;line-height:1.1}
.htitle span{color:var(--cream);font-size:.75rem;font-weight:400;letter-spacing:3px;display:block}
nav{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
nav button{background:transparent;border:1px solid var(--b1);color:var(--cream);font-family:'Oswald',sans-serif;font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase;padding:.35rem .9rem;cursor:pointer;transition:all .2s}
nav button:hover,nav button.active{border-color:var(--gold);color:var(--gold2);background:rgba(201,168,76,.1)}
.ubadge{background:rgba(201,168,76,.15);border:1px solid var(--gold);color:var(--gold2);padding:.3rem .8rem;font-family:'Oswald',sans-serif;font-size:.8rem}
.lbtn{background:rgba(185,28,28,.2)!important;border-color:var(--red)!important;color:#fca5a5!important}
.page{display:none;padding:2rem 1.5rem;max-width:980px;margin:0 auto}
.page.active{display:block}
.card{background:var(--navy2);border:1px solid var(--b1);padding:1.5rem;margin-bottom:1rem}
.ctitle{font-family:'Oswald',sans-serif;font-size:1rem;color:var(--gold2);text-transform:uppercase;letter-spacing:2px;margin-bottom:1rem;padding-bottom:.5rem;border-bottom:1px solid var(--b1)}
.fg{margin-bottom:.9rem}
label{display:block;color:var(--gold3);font-size:.82rem;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:.35rem;font-family:'Oswald',sans-serif}
input[type=text],input[type=password],input[type=date],input[type=number],select{width:100%;background:rgba(0,0,0,.4);border:1px solid var(--b2);color:var(--cream);padding:.55rem .8rem;font-family:'Rajdhani',sans-serif;font-size:1rem;outline:none;transition:border-color .2s}
input:focus,select:focus{border-color:var(--gold)}
select option{background:var(--navy2)}
.btn{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:2px;padding:.55rem 1.4rem;cursor:pointer;font-size:.85rem;border:none;transition:all .2s}
.bgold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:var(--navy);font-weight:700}
.bgold:hover{filter:brightness(1.1);transform:translateY(-1px)}
.bgold:disabled{opacity:.5;cursor:not-allowed;transform:none}
.boutline{background:transparent;border:1px solid var(--gold);color:var(--gold2)}
.boutline:hover{background:rgba(201,168,76,.1)}
.bdanger{background:rgba(185,28,28,.3);border:1px solid var(--red);color:#fca5a5}
.bsm{padding:.28rem .7rem;font-size:.72rem}
#loginPage{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:85vh;padding:1.5rem}
.lbox{width:100%;max-width:410px;background:var(--navy2);border:1px solid var(--b2);padding:2rem;position:relative}
.lbox::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.llogoW{text-align:center;margin-bottom:1.2rem}
.llogoW img{width:100px}
.ltabs{display:flex;margin-bottom:1.2rem}
.ltab{flex:1;padding:.55rem;background:transparent;border:1px solid var(--b1);color:var(--cream);font-family:'Oswald',sans-serif;font-size:.85rem;letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;transition:all .2s}
.ltab.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold2)}
.tc{display:none}
.tc.active{display:block}
.msg{padding:.55rem .9rem;margin-bottom:.8rem;font-size:.88rem}
.merr{background:rgba(185,28,28,.2);border-left:3px solid var(--red);color:#fca5a5}
.mok{background:rgba(22,163,74,.2);border-left:3px solid #16a34a;color:#86efac}
.minfo{background:rgba(201,168,76,.12);border-left:3px solid var(--gold);color:var(--gold3)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:.55rem;margin:.8rem 0}
.pchip{padding:.45rem .7rem;border:1px solid var(--b1);background:transparent;color:var(--cream);font-family:'Rajdhani',sans-serif;font-size:.92rem;cursor:pointer;transition:all .2s;text-align:center}
.pchip.sel{background:rgba(201,168,76,.2);border-color:var(--gold);color:var(--gold2)}
.stbl{width:100%;border-collapse:collapse}
.stbl th{background:rgba(201,168,76,.15);color:var(--gold2);font-family:'Oswald',sans-serif;font-size:.82rem;letter-spacing:1.5px;text-transform:uppercase;padding:.55rem .8rem;text-align:left;border-bottom:1px solid var(--b2)}
.stbl td{padding:.45rem .8rem;border-bottom:1px solid rgba(201,168,76,.08);font-size:.97rem}
.stbl input[type=number]{width:85px;padding:.28rem .5rem}
.srow{display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:.9rem;padding:.65rem .8rem;border-bottom:1px solid rgba(201,168,76,.08);cursor:pointer;transition:background .15s}
.srow:hover{background:rgba(201,168,76,.05)}
.rbadge{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:.82rem}
.r1{background:rgba(255,215,0,.2);border:1px solid #ffd700;color:#ffd700}
.r2{background:rgba(192,192,192,.2);border:1px solid #c0c0c0;color:#c0c0c0}
.r3{background:rgba(205,127,50,.2);border:1px solid #cd7f32;color:#cd7f32}
.rn{background:rgba(201,168,76,.08);border:1px solid var(--b1);color:var(--cream)}
.tpts{font-family:'Oswald',sans-serif;font-size:1.15rem;color:var(--gold2)}
.movl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center}
.movl.open{display:flex}
.modal{background:var(--navy2);border:1px solid var(--b2);padding:2rem;width:90%;max-width:580px;max-height:82vh;overflow-y:auto;position:relative}
.modal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.mclose{position:absolute;top:.9rem;right:.9rem;background:none;border:none;color:var(--gold);font-size:1.4rem;cursor:pointer;line-height:1}
.spin{width:30px;height:30px;border:3px solid var(--b1);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin:1.5rem auto}
@keyframes sp{to{transform:rotate(360deg)}}
.ptitle{font-family:'Oswald',sans-serif;font-size:1.7rem;color:var(--gold2);text-transform:uppercase;letter-spacing:3px;margin-bottom:.2rem}
.psub{color:rgba(245,232,208,.55);font-size:.88rem;letter-spacing:1px;margin-bottom:1.3rem}
.steps{display:flex;gap:.4rem;margin-bottom:1.3rem}
.step{flex:1;height:4px;background:var(--b1);transition:background .3s}
.step.act{background:var(--gold)}
.step.dn{background:rgba(201,168,76,.45)}
.sinfo{background:rgba(201,168,76,.07);border:1px solid var(--b1);padding:.55rem .9rem;margin-bottom:.9rem;font-size:.88rem;display:flex;justify-content:space-between;align-items:center}
.rbdg{background:var(--gold);color:var(--navy);font-family:'Oswald',sans-serif;font-weight:700;padding:.12rem .55rem;font-size:.82rem}
.tm{color:rgba(245,232,208,.5);font-size:.88rem}
.mt1{margin-top:.5rem}.mt2{margin-top:1rem}
.fw{width:100%}
.flex{display:flex}.g1{gap:.5rem}.g2{gap:1rem}
@media(max-width:580px){header{padding:.6rem};.page{padding:1rem}}
</style>
</head>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4dXJsZHl1ZHJ3Ym5udGNrZnZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0OTU0NDQsImV4cCI6MjEwNDA3MTQ0NH0.ToVVcYZgRIOJ3Y2f54ET4lL3JG0wTmTo9LuC1yJ0bm4';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Malý retry helper — skúsi requestu dať 2 ďalšie šance pri sieťovej chybe
// (chyba typu "failed to fetch"), nie pri chybe, ktorú vráti databáza.
async function withRetry(fn, tries = 3) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try { return await fn(); }
    catch (e) {
      lastErr = e;
      if (i < tries - 1) await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
  throw lastErr;
}

// ── STATE ──
let me = null, selPlayers = [], gameDate = '', round = 1, rounds = [], gameOn = false;

window.addEventListener('load', () => {
  const s = localStorage.getItem('ss_u');
  if (s) { me = JSON.parse(s); showApp(); }
  document.getElementById('gameDate').value = new Date().toISOString().split('T')[0];
});

// ── TABS ──
function switchTab(t) {
  document.querySelectorAll('.ltab').forEach((b,i) => b.classList.toggle('active',(t==='login'&&i===0)||(t==='register'&&i===1)));
  document.getElementById('loginForm').classList.toggle('active', t==='login');
  document.getElementById('registerForm').classList.toggle('active', t==='register');
  document.getElementById('loginMsg').innerHTML = '';
}

// ── LOGIN ──
async function doLogin() {
  const name = document.getElementById('lName').value.trim();
  const pass = document.getElementById('lPass').value;
  const msg = document.getElementById('loginMsg');
  if (!name||!pass) { msg.innerHTML = '<div class="msg merr">Vyplňte meno aj heslo.</div>'; return; }
  msg.innerHTML = '<div class="spin"></div>';
  try {
    const { data, error } = await withRetry(() => sb.rpc('login_player', { p_name: name, p_password: pass }));
    if (error) throw new Error(error.message);
    if (data.status === 'error') { msg.innerHTML = `<div class="msg merr">${data.message}</div>`; return; }
    me = { name };
    localStorage.setItem('ss_u', JSON.stringify(me));
    showApp();
  } catch(e) { msg.innerHTML = `<div class="msg merr">Chyba: ${e.message}</div>`; }
}

// ── REGISTER ──
async function doRegister() {
  const name = document.getElementById('rName').value.trim();
  const pass = document.getElementById('rPass').value;
  const pass2 = document.getElementById('rPass2').value;
  const msg = document.getElementById('loginMsg');
  if (!name) { msg.innerHTML = '<div class="msg merr">Zadajte meno.</div>'; return; }
  if (pass.length < 4) { msg.innerHTML = '<div class="msg merr">Heslo musí mať aspoň 4 znaky.</div>'; return; }
  if (pass !== pass2) { msg.innerHTML = '<div class="msg merr">Heslá sa nezhodujú.</div>'; return; }
  msg.innerHTML = '<div class="spin"></div>';
  try {
    const { data, error } = await withRetry(() => sb.rpc('register_player', { p_name: name, p_password: pass }));
    if (error) throw new Error(error.message);
    if (data.status === 'error') { msg.innerHTML = `<div class="msg merr">${data.message}</div>`; return; }
    msg.innerHTML = '<div class="msg mok">Registrácia úspešná! Prihláste sa.</div>';
    switchTab('login');
    document.getElementById('lName').value = name;
  } catch(e) { msg.innerHTML = `<div class="msg merr">Chyba: ${e.message}</div>`; }
}

function logout() {
  me = null; localStorage.removeItem('ss_u');
  document.getElementById('mainHeader').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
}

function showApp() {
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('mainHeader').style.display = 'flex';
  document.getElementById('ubadge').textContent = '👤 ' + me.name;
  showPage('gamePage');
}

// ── NAV ──
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id==='gamePage') { document.getElementById('navGame').classList.add('active'); if (!gameOn) loadPlayers(); }
  if (id==='scorePage') { document.getElementById('navScore').classList.add('active'); loadScoreboard(); }
}

// ── GAME SETUP ──
async function loadPlayers() {
  const g = document.getElementById('pgrid');
  g.innerHTML = '<div class="spin"></div>';
  try {
    const { data, error } = await withRetry(() => sb.from('players_public').select('name').order('name'));
    if (error) throw new Error(error.message);
    const names = (data || []).map(r => r.name).filter(Boolean);
    g.innerHTML = '';
    if (!names.length) { g.innerHTML = '<div class="tm">Žiadni hráči. Zaregistrujte sa.</div>'; return; }
    names.forEach(n => {
      const d = document.createElement('div');
      d.className = 'pchip'; d.textContent = n;
      d.onclick = () => {
        d.classList.toggle('sel');
        selPlayers = [...document.querySelectorAll('.pchip.sel')].map(c => c.textContent);
        document.getElementById('selCount').textContent = selPlayers.length ? `Vybraní: ${selPlayers.length}` : '';
      };
      g.appendChild(d);
    });
  } catch(e) { g.innerHTML = `<div class="msg merr">Chyba: ${e.message}</div>`; }
}

function startGame() {
  const date = document.getElementById('gameDate').value;
  if (!date) { document.getElementById('setupMsg').innerHTML = '<div class="msg merr">Vyberte dátum.</div>'; return; }
  if (selPlayers.length < 2) { document.getElementById('setupMsg').innerHTML = '<div class="msg merr">Vyberte aspoň 2 hráčov.</div>'; return; }
  gameDate = date; round = 1; rounds = []; gameOn = true;
  document.getElementById('gStep1').style.display = 'none';
  document.getElementById('gStep2').style.display = 'block';
  document.getElementById('sDateLbl').textContent = 'Dátum: ' + fmtD(date);
  buildTable();
}

function buildTable() {
  document.getElementById('rndTitle').textContent = round;
  document.getElementById('rndBadge').textContent = 'Kolo ' + round;
  const tb = document.getElementById('scoreBody');
  tb.innerHTML = '';
  selPlayers.forEach((n,i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${i+1}</td><td style="font-weight:600">${n}</td><td><input type="number" min="0" max="9999" placeholder="0" id="p${i}"></td>`;
    tb.appendChild(tr);
  });
  document.getElementById('scoreMsg').innerHTML = '';
  document.getElementById('saveBtn').disabled = false;
}

// ── NAČÍTANIE Z leg_results (posledný zápis pre každého hráča) ──
async function loadLegResults() {
  const msg = document.getElementById('scoreMsg');
  msg.innerHTML = '<div class="spin"></div>';
  try {
    const { data, error } = await withRetry(() =>
      sb.from('leg_results').select('player_name, points, created_at').order('created_at', { ascending: true })
    );
    if (error) throw new Error(error.message);
    // zoradené od najstaršieho po najnovší — posledný výskyt mena v cykle je teda jeho posledný záznam
    const latest = {};
    (data || []).forEach(r => { latest[r.player_name] = r.points; });

    let filled = 0;
    selPlayers.forEach((n, i) => {
      if (latest[n] !== undefined && latest[n] !== null) {
        document.getElementById('p' + i).value = latest[n];
        filled++;
      }
    });
    msg.innerHTML = filled
      ? `<div class="msg mok">Načítané body pre ${filled} hráčov z tabuľky leg_results.</div>`
      : `<div class="msg minfo">V leg_results sa nenašli záznamy pre hráčov tohto kola.</div>`;
  } catch (e) {
    msg.innerHTML = `<div class="msg merr">Chyba načítania z leg_results: ${e.message}</div>`;
  }
}

// Po úspešnom uložení kola vyprázdni leg_results (best-effort — chyba tu
// neprekazí uloženie kola, len sa potichu zaloguje).
async function clearLegResults() {
  try {
    const { error } = await sb.from('leg_results').delete().gte('id', 0);
    if (error) console.warn('Nepodarilo sa vyprázdniť leg_results:', error.message);
  } catch (e) {
    console.warn('Nepodarilo sa vyprázdniť leg_results:', e.message);
  }
}

// ── SAVE ROUND — všetky záznamy cez JSONP ──
async function saveRound() {
  const scores = selPlayers.map((n,i) => ({ name: n, pts: parseInt(document.getElementById('p'+i).value)||0 }));
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('scoreMsg');
  btn.disabled = true;
  msg.innerHTML = '<div class="spin"></div>';

  try {
    // Celé kolo sa zapíše jedným požiadavkom — buď sa uložia všetci, alebo nikto.
    // upsert (namiesto insert) navyše zaručí, že prípadné opakovanie po výpadku
    // siete nevytvorí duplicitné riadky (funguje vďaka uniq_round_entry v DB).
    const payload = scores.map(s => ({
      game_date: gameDate,
      round: round,
      player_name: s.name,
      points: s.pts,
      saved_by: me.name
    }));
    const { error } = await withRetry(() =>
      sb.from('results').upsert(payload, { onConflict: 'game_date,round,player_name' })
    );
    if (error) throw new Error(error.message);
    rounds.push({ round, scores });
    buildHistory();
    round++;
    buildTable();
    msg.innerHTML = `<div class="msg mok">✅ Kolo ${round-1} uložené! (${scores.length} hráčov)</div>`;
    clearLegResults();
  } catch(e) {
    btn.disabled = false;
    msg.innerHTML = `<div class="msg merr">Chyba zápisu: ${e.message}</div>`;
  }
}

function buildHistory() {
  let h = '';
  rounds.forEach(rd => {
    const s = [...rd.scores].sort((a,b)=>b.pts-a.pts);
    h += `<div class="card" style="margin-top:.5rem"><div class="ctitle">Kolo ${rd.round}</div>
      <table class="stbl"><tr><th>#</th><th>Hráč</th><th>Body</th></tr>
      ${s.map((x,i)=>`<tr><td>${i+1}.</td><td>${x.name}</td><td><strong>${x.pts}</strong></td></tr>`).join('')}
      </table></div>`;
  });
  document.getElementById('rndHistory').innerHTML = h;
}

function finishGame() {
  if (!rounds.length) { document.getElementById('scoreMsg').innerHTML = '<div class="msg merr">Zadajte aspoň 1 kolo.</div>'; return; }
  const tot = {};
  selPlayers.forEach(n => tot[n]=0);
  rounds.forEach(rd => rd.scores.forEach(s => tot[s.name]=(tot[s.name]||0)+s.pts));
  const srt = Object.entries(tot).sort((a,b)=>b[1]-a[1]);
  document.getElementById('summaryTbl').innerHTML =
    `<thead><tr><th>#</th><th>Hráč</th><th>Celkom</th></tr></thead>
     <tbody>${srt.map((e,i)=>`<tr><td>${i+1}.</td><td>${e[0]}</td><td><strong>${e[1]}</strong></td></tr>`).join('')}</tbody>`;
  document.getElementById('gStep2').style.display = 'none';
  document.getElementById('gStep3').style.display = 'block';
  gameOn = false;
}

function resetGame() {
  gameOn=false; round=1; rounds=[]; selPlayers=[];
  document.getElementById('gStep1').style.display='block';
  document.getElementById('gStep2').style.display='none';
  document.getElementById('gStep3').style.display='none';
  document.getElementById('rndHistory').innerHTML='';
  document.querySelectorAll('.pchip').forEach(c=>c.classList.remove('sel'));
  document.getElementById('selCount').textContent='';
  document.getElementById('setupMsg').innerHTML='';
}

function cancelGame() {
  if (!confirm('Zrušiť hrací deň?')) return;
  resetGame();
}

// ── SCOREBOARD ──
async function loadScoreboard() {
  const c = document.getElementById('sbContent');
  c.innerHTML = '<div class="spin"></div>';
  try {
    const { data: rows, error } = await withRetry(() =>
      sb.from('results').select('player_name, points, game_date, round')
    );
    if (error) throw new Error(error.message);
    const tot = {}, byP = {};
    (rows || []).forEach(r => {
      const n = r.player_name || '';
      if (!n) return;
      const p = parseInt(r.points) || 0;
      tot[n] = (tot[n]||0)+p;
      if (!byP[n]) byP[n]=[];
      byP[n].push({ date: r.game_date||'', round: r.round||'', pts: p });
    });
    const srt = Object.entries(tot).sort((a,b)=>b[1]-a[1]);
    if (!srt.length) { c.innerHTML='<div class="card tm" style="padding:2rem;text-align:center">Zatiaľ žiadne výsledky</div>'; return; }
    let h = '<div class="card" style="padding:0">';
    srt.forEach(([n,total],i) => {
      const rk=i+1, rc=rk===1?'r1':rk===2?'r2':rk===3?'r3':'rn';
      const enc = encodeURIComponent(JSON.stringify(byP[n]));
      h += `<div class="srow" onclick="showDetail('${n}','${enc}')">
        <div class="rbadge ${rc}">${rk}</div>
        <div style="font-size:1rem;font-weight:600">${n}</div>
        <div class="tpts">${total}<span style="font-size:.7rem;color:rgba(245,232,208,.45)"> b</span></div>
      </div>`;
    });
    h += '</div>';
    c.innerHTML = h;
  } catch(e) { c.innerHTML=`<div class="msg merr">Chyba: ${e.message}</div>`; }
}

function showDetail(name, enc) {
  const hist = JSON.parse(decodeURIComponent(enc));
  const bd = {};
  hist.forEach(h => { if (!bd[h.date]) bd[h.date]={r:[],t:0}; bd[h.date].r.push(h); bd[h.date].t+=h.pts; });
  const dates = Object.keys(bd).sort().reverse();
  let h = `<div style="font-family:Oswald,sans-serif;font-size:1.25rem;color:var(--gold2);margin-bottom:1rem">🎯 ${name}</div>`;
  if (!dates.length) h += '<div class="tm">Žiadne záznamy</div>';
  dates.forEach(d => {
    const x = bd[d];
    h += `<div style="margin-bottom:1rem">
      <div style="color:var(--gold3);font-size:.83rem;margin-bottom:.35rem">${fmtD(d)} — Spolu: <strong style="color:var(--gold2)">${x.t}</strong> b</div>
      <table class="stbl" style="font-size:.88rem"><tr><th>Kolo</th><th>Body</th></tr>
      ${x.r.sort((a,b)=>a.round-b.round).map(r=>`<tr><td>Kolo ${r.round}</td><td>${r.pts}</td></tr>`).join('')}
      </table></div>`;
  });
  document.getElementById('modalBody').innerHTML = h;
  document.getElementById('detModal').classList.add('open');
}

function closeModal() { document.getElementById('detModal').classList.remove('open'); }
function fmtD(d) { if (!d) return '—'; const p=d.split('-'); return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:d; }
</script>
